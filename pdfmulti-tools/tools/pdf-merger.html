<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger - PDF Multi-Tools</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/styles.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header will be dynamically loaded -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">PDF Merger</h1>
                <p class="text-center mb-4">Combine multiple PDF files into a single document</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="tool-container">
                    <div class="file-upload-area" id="drop-area">
                        <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                        <h4>Drag & Drop PDF Files Here</h4>
                        <p class="text-muted">or</p>
                        <input type="file" id="file-input" multiple accept=".pdf" class="d-none">
                        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                            Choose Files
                        </button>
                    </div>

                    <div id="file-list" class="mt-4">
                        <!-- Files will be listed here -->
                    </div>
                    
                    <div id="drag-instructions" class="text-center mt-3 mb-3 d-none">
                        <p class="text-muted"><i class="fas fa-info-circle me-1"></i> Drag files to reorder them</p>
                    </div>

                    <div class="progress mt-3 d-none" id="progress-bar" style="height: 10px;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <p class="text-center mt-2" id="progress-text"></p>

                    <div class="mt-4 text-center">
                        <button id="merge-btn" class="btn btn-primary" disabled>
                            <i class="fas fa-object-group me-2"></i> Merge PDFs
                        </button>
                        <button id="clear-btn" class="btn btn-outline-secondary ms-2" disabled>
                            <i class="fas fa-trash-alt me-2"></i> Clear All
                        </button>
                    </div>

                    <div class="spinner" id="loading-spinner"></div>
                </div>

                <!-- Ad Section -->
                <div class="ad-container text-center mt-4">
                    <div class="ad-placeholder">
                        Advertisement
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded -->
    <div id="footer-placeholder"></div>

    <!-- Required Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/downloadjs@1.4.7/download.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/tools/pdf-merger.js"></script>
</body>
</html>
