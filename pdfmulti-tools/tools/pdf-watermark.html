<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Watermark - PDF Multi-Tools</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/styles.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- FileSaver.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <!-- Header will be dynamically loaded -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">PDF Watermark</h1>
                <div class="card">
                    <div class="card-body">
                        <!-- File Upload Section -->
                        <div class="mb-4">
                            <h5 class="card-title">Upload PDF</h5>
                            <div class="upload-area p-4 text-center border rounded bg-light">
                                <i class="fas fa-file-pdf fa-3x mb-3 text-primary"></i>
                                <p class="mb-2">Drag and drop PDF here or</p>
                                <input type="file" id="pdfInput" accept=".pdf" class="d-none">
                                <button class="btn btn-primary" onclick="document.getElementById('pdfInput').click()">
                                    <i class="fas fa-plus me-2"></i>Select PDF
                                </button>
                            </div>
                        </div>

                        <!-- Watermark Settings -->
                        <div id="watermarkSettings" class="mb-4 d-none">
                            <h5 class="card-title">Watermark Settings</h5>
                            <div class="row g-3">
                                <!-- Watermark Type -->
                                <div class="col-md-6">
                                    <label class="form-label">Watermark Type</label>
                                    <select class="form-select" id="watermarkType">
                                        <option value="text">Text</option>
                                        <option value="image">Image</option>
                                    </select>
                                </div>

                                <!-- Text Watermark Settings -->
                                <div id="textSettings">
                                    <div class="col-12">
                                        <label class="form-label">Watermark Text</label>
                                        <input type="text" class="form-control" id="watermarkText" placeholder="Enter watermark text">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Font Size</label>
                                        <input type="number" class="form-control" id="fontSize" value="48" min="8" max="144">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Font Color</label>
                                        <input type="color" class="form-control form-control-color" id="fontColor" value="#000000">
                                    </div>
                                </div>

                                <!-- Image Watermark Settings -->
                                <div id="imageSettings" class="d-none">
                                    <div class="col-12">
                                        <label class="form-label">Watermark Image</label>
                                        <div class="upload-area p-3 text-center border rounded bg-light">
                                            <input type="file" id="watermarkImage" accept="image/*" class="d-none">
                                            <button class="btn btn-outline-primary" onclick="document.getElementById('watermarkImage').click()">
                                                <i class="fas fa-image me-2"></i>Select Image
                                            </button>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Image Size (%)</label>
                                        <input type="number" class="form-control" id="imageSize" value="30" min="1" max="100">
                                    </div>
                                </div>

                                <!-- Common Settings -->
                                <div class="col-md-6">
                                    <label class="form-label">Opacity (%)</label>
                                    <input type="number" class="form-control" id="opacity" value="30" min="1" max="100">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Rotation (degrees)</label>
                                    <input type="number" class="form-control" id="rotation" value="45" min="-180" max="180">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Position</label>
                                    <select class="form-select" id="position">
                                        <option value="center">Center</option>
                                        <option value="topLeft">Top Left</option>
                                        <option value="topRight">Top Right</option>
                                        <option value="bottomLeft">Bottom Left</option>
                                        <option value="bottomRight">Bottom Right</option>
                                        <option value="tile">Tile</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Pages to Watermark</label>
                                    <select class="form-select" id="pageRange">
                                        <option value="all">All Pages</option>
                                        <option value="first">First Page Only</option>
                                        <option value="custom">Custom Range</option>
                                    </select>
                                </div>
                                <div id="customPageRange" class="col-12 d-none">
                                    <label class="form-label">Custom Page Range</label>
                                    <input type="text" class="form-control" id="customPages" placeholder="e.g., 1,3-5,7">
                                    <small class="text-muted">Enter page numbers separated by commas, or ranges with hyphens</small>
                                </div>
                            </div>
                        </div>

                        <!-- Preview Section -->
                        <div id="previewSection" class="mb-4 d-none">
                            <h5 class="card-title">Preview</h5>
                            <div class="text-center border rounded p-3">
                                <canvas id="previewCanvas" class="img-fluid"></canvas>
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="progress mb-3 d-none" id="progressBar">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                        </div>

                        <!-- Status Text -->
                        <div id="statusText" class="text-center mb-3"></div>

                        <!-- Action Buttons -->
                        <div class="text-center">
                            <button id="previewBtn" class="btn btn-secondary btn-lg me-2 d-none">
                                <i class="fas fa-eye me-2"></i>Preview
                            </button>
                            <button id="applyBtn" class="btn btn-primary btn-lg" disabled>
                                <i class="fas fa-stamp me-2"></i>Apply Watermark
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/tools/pdf-watermark.js"></script>
</body>
</html>
