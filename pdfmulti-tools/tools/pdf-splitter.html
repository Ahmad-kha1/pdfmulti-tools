<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Splitter - PDF Multi-Tools</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/styles.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header will be dynamically loaded -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">PDF Splitter</h1>
                <p class="text-center mb-4">Split PDF files into multiple documents</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="tool-container">
                    <div class="file-upload-area" id="drop-area">
                        <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                        <h4>Drag & Drop PDF File Here</h4>
                        <p class="text-muted">or</p>
                        <input type="file" id="file-input" accept=".pdf" class="d-none">
                        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                            Choose File
                        </button>
                    </div>

                    <div id="file-info" class="mt-4 d-none">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">PDF Information</h5>
                                <div id="page-count" class="mb-2">Total Pages: <span id="total-pages">0</span></div>
                                <div class="mb-3">
                                    <label for="split-method" class="form-label">Split Method:</label>
                                    <select class="form-select" id="split-method">
                                        <option value="range">Split by Page Range</option>
                                        <option value="every">Split Every N Pages</option>
                                    </select>
                                </div>
                                <div id="range-input" class="mb-3">
                                    <label class="form-label">Page Ranges (e.g., 1-3, 4-6)</label>
                                    <input type="text" class="form-control" id="page-ranges" placeholder="1-3, 4-6">
                                </div>
                                <div id="every-input" class="mb-3 d-none">
                                    <label class="form-label">Split Every</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="split-every" min="1" value="1">
                                        <span class="input-group-text">pages</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <button id="split-btn" class="btn btn-primary" disabled>
                            <i class="fas fa-cut"></i> Split PDF
                        </button>
                    </div>

                    <div class="spinner" id="loading-spinner"></div>
                </div>

                <!-- Ad Section -->
                <div class="ad-container text-center mt-4">
                    <div class="ad-placeholder">
                        Advertisement
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/tools/pdf-splitter.js"></script>
</body>
</html>
