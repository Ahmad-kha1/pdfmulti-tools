<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Excel Converter - PDF Multi-Tools</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/styles.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header will be dynamically loaded -->
    <div id="header-placeholder"></div>

    <main class="container my-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4">PDF to Excel Converter</h1>
                <p class="text-center mb-4">Convert PDF tables to Excel spreadsheets</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="tool-container">
                    <div class="file-upload-area" id="drop-area">
                        <i class="fas fa-cloud-upload-alt fa-3x mb-3"></i>
                        <h4>Drag & Drop PDF File Here</h4>
                        <p class="text-muted">or</p>
                        <input type="file" id="file-input" accept=".pdf" class="d-none">
                        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                            Choose File
                        </button>
                    </div>

                    <div id="file-info" class="mt-4 d-none">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">PDF Information</h5>
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <div class="mb-2">File Size: <span id="file-size">0 MB</span></div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-2">Pages: <span id="total-pages">0</span></div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="output-format" class="form-label">Output Format:</label>
                                    <select class="form-select" id="output-format">
                                        <option value="xlsx">XLSX (Excel 2007+)</option>
                                        <option value="xls">XLS (Excel 97-2003)</option>
                                        <option value="csv">CSV (Comma Separated)</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Extraction Options:</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="auto-detect-tables" checked>
                                        <label class="form-check-label" for="auto-detect-tables">
                                            Auto-detect Tables
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="preserve-formatting" checked>
                                        <label class="form-check-label" for="preserve-formatting">
                                            Preserve Formatting
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="extract-images" checked>
                                        <label class="form-check-label" for="extract-images">
                                            Extract Images
                                        </label>
                                    </div>
                                </div>
                                <div id="table-selection" class="mb-3 d-none">
                                    <label class="form-label">Select Tables to Extract:</label>
                                    <div id="table-list" class="border rounded p-2" style="max-height: 200px; overflow-y: auto;">
                                        <!-- Tables will be listed here -->
                                    </div>
                                </div>
                                <div class="alert alert-info">
                                    <i class="fas fa-info-circle me-2"></i>
                                    Estimated conversion time: <span id="estimated-time">0 seconds</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 text-center">
                        <button id="convert-btn" class="btn btn-primary" disabled>
                            <i class="fas fa-file-excel"></i> Convert to Excel
                        </button>
                    </div>

                    <div class="spinner" id="loading-spinner"></div>
                </div>

                <!-- Ad Section -->
                <div class="ad-container text-center mt-4">
                    <div class="ad-placeholder">
                        Advertisement
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be dynamically loaded -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="../js/tools/pdf-to-excel.js"></script>
</body>
</html>
